name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v26.10.5)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/hiderecent-release.jks
          test -s keystore/hiderecent-release.jks || { echo "keystore empty"; exit 1; }
          head -c 4 keystore/hiderecent-release.jks | od -c | head -1

      - name: Build release APK
        working-directory: custom-ntp-lsp
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Align and Sign APK (v1 + v2 + v3)
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          UNSIGNED=custom-ntp-lsp/app/build/outputs/apk/release/app-release-unsigned.apk
          ALIGNED=custom-ntp-lsp/app/build/outputs/apk/release/app-release-aligned.apk
          SIGNED=custom-ntp-lsp/app/build/outputs/apk/release/app-release.apk
          KS=keystore/hiderecent-release.jks
          # Step 1: zipalign (4-byte alignment, required before apksigner)
          $ANDROID_HOME/build-tools/35.0.0/zipalign -v 4 "$UNSIGNED" "$ALIGNED"
          # Step 2: apksigner signs v1 + v2 + v3 in one pass
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks "$KS" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$RELEASE_STORE_PASSWORD" \
            --key-pass "pass:$RELEASE_KEY_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$SIGNED" "$ALIGNED"

      - name: Verify signing
        run: |
          APK=custom-ntp-lsp/app/build/outputs/apk/release/app-release.apk
          ls -l "$APK"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK" | head -8

      - name: Upload release APK to original repo
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: custom-ntp-lsp/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Sync module source to LSPosed module repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          REPO=Xposed-Modules-Repo/top.gtian.heliumcustom
          # Remove extraheader injected by actions/checkout so our PAT in URL is used
          git config --unset-all http.https://github.com/.extraheader || true
          # Split custom-ntp-lsp subdirectory into a standalone branch
          # (LSPosed module repo expects Gradle project at root, not in a subdirectory)
          git subtree split --prefix=custom-ntp-lsp --branch lsposed-sync
          git remote add xposed "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          git push xposed lsposed-sync:main --force
          git branch -D lsposed-sync

      - name: Publish to LSPosed module repo
        env:
          GH_TOKEN: ${{ secrets.XPOSED_REPO_TOKEN }}
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          APK=custom-ntp-lsp/app/build/outputs/apk/release/app-release.apk
          REPO=Xposed-Modules-Repo/top.gtian.heliumcustom
          # Delete existing release+tag to ensure clean state
          gh release delete "$TAG" --repo "$REPO" --yes 2>/dev/null || true
          git push --delete xposed "$TAG" 2>/dev/null || true
          # Create fresh release (tag points to LSPosed repo main HEAD, just synced)
          gh release create "$TAG" \
            --repo "$REPO" \
            --target main \
            --title "$TAG" \
            --notes "See https://github.com/GTian5418/android-titanium-browser-hook/releases/tag/$TAG" \
            "$APK"
