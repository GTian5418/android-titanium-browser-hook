<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新标签页</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #fff; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; font-family: system-ui, sans-serif;
      color: #5f6368; font-size: 14px;
    }
    .spinner {
      width: 24px; height: 24px; margin-right: 12px;
      border: 3px solid #e8eaed; border-top-color: #1a73e8;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div>正在跳转…</div>
  <script src="custom_tab.js"></script>
</body>
</html>
